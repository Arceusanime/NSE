[project]
name = "nse-fo-opening-price-scanner"
version = "0.1.0"
description = "NSE F&O opening-price anchored open-interest scanner"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0.30,<3",
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "apscheduler>=3.10,<4",
  "pyotp>=2.9,<3",
  "smartapi-python==1.5.5",
  "logzero>=1.7,<2",
  "websocket-client>=1.8,<2",
  "pycryptodome>=3.20,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
